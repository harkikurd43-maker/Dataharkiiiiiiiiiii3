<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEF-INTEL // دەزگای هەواڵگری و چاودێری نیشتمانی</title>

<!-- فۆنتە تاکتیکی و کوردییەکان -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<!-- نەخشەی Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root {
  --term-green: #00ff66;
  --term-green-glow: rgba(0, 255, 102, 0.4);
  --term-cyan: #00f0ff;
  --term-cyan-glow: rgba(0, 240, 255, 0.35);
  --term-amber: #ffb700;
  --term-crimson: #ff003c;
  --term-crimson-glow: rgba(255, 0, 60, 0.4);
  --bg-void: #010409;
  --bg-panel: rgba(5, 10, 20, 0.94);
  --bg-card: rgba(8, 16, 30, 0.85);
  --border-cyan: 1px solid rgba(0, 240, 255, 0.3);
  --border-green: 1px solid rgba(0, 255, 102, 0.3);
  --border-dark: 1px solid #152238;
  --font-kurdish: 'Vazirmatn', Tahoma, sans-serif;
  --font-code: 'JetBrains Mono', 'Share Tech Mono', monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(--font-kurdish) !important;
  font-weight: 700;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-void);
  color: #e2e8f0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background-image: 
    radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.03) 0%, transparent 80%),
    linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
  background-size: 100% 100%, 24px 24px, 24px 24px;
}

/* هێڵی سکانینگی ڕاداری هەواڵگری */
body::after {
  content: " ";
  position: fixed; inset: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
  background-size: 100% 3px;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.7;
}

/* ================= تێرمیناڵی سەرەوە (HUD HEADER) ================= */
header {
  background: var(--bg-panel);
  border-bottom: 1.5px solid var(--term-cyan);
  padding: 6px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 1000;
  box-shadow: 0 4px 25px rgba(0, 240, 255, 0.15);
  flex-wrap: wrap;
  gap: 8px;
}

.terminal-brand { display: flex; align-items: center; gap: 10px; }
.pulse-indicator {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--term-green); box-shadow: 0 0 10px var(--term-green);
  animation: radarBlink 1.4s infinite;
}
@keyframes radarBlink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.3); } }

.terminal-tag {
  font-family: var(--font-code) !important;
  font-size: 10.5px; color: var(--term-cyan);
  background: rgba(0, 240, 255, 0.08); border: 1px solid var(--term-cyan);
  padding: 2px 7px; border-radius: 3px; letter-spacing: 1px;
}
.brand-name {
  font-size: 13.5px; font-weight: 900;
  color: #ffffff; letter-spacing: 0.5px;
}
.brand-name span { color: var(--term-cyan); }

.city-selector-hud {
  display: flex; background: #030814;
  padding: 2px; border-radius: 6px; border: 1px solid #1e293b; gap: 3px;
}
.city-pill-btn {
  background: transparent; color: #64748b; border: 1px solid transparent;
  padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
  transition: 0.2s; display: flex; align-items: center; gap: 4px;
}
.city-pill-btn.active {
  background: rgba(0, 240, 255, 0.18); color: var(--term-cyan);
  border-color: var(--term-cyan);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
  text-shadow: 0 0 8px var(--term-cyan);
}

.nav-hacker-tabs {
  display: flex; background: #030814;
  padding: 2px; border-radius: 6px; border: 1px solid #1e293b; gap: 3px;
}
.tab-cmd-btn {
  background: transparent; color: #64748b; border: none;
  padding: 5px 12px; border-radius: 5px; font-size: 11.5px; cursor: pointer;
  display: flex; align-items: center; gap: 5px; transition: 0.2s;
}
.tab-cmd-btn.active {
  background: rgba(0, 255, 102, 0.15); color: var(--term-green);
  border: 1px solid var(--term-green);
  text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
  box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
}
.tab-cmd-btn.active.elec-mode {
  background: rgba(0, 240, 255, 0.15); color: var(--term-cyan);
  border-color: var(--term-cyan);
  text-shadow: 0 0 8px var(--term-cyan);
}

.main-viewport { flex: 1; height: calc(100vh - 48px); position: relative; }

/* ================= بەشی ١: خێزان و تۆماری مەدەنی ================= */
#tabFamily {
  height: 100%; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;
}
.terminal-box {
  background: var(--bg-panel); border: var(--border-cyan);
  border-radius: 8px; padding: 12px 14px; position: relative;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
}
.terminal-box::before {
  content: attr(data-tag);
  position: absolute; top: -8px; left: 12px;
  background: #010409; font-family: var(--font-code) !important;
  font-size: 9px; color: var(--term-cyan); padding: 0 6px;
  border: 1px solid var(--term-cyan); border-radius: 3px;
}

.hacker-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 6px;
}
.term-field label { font-size: 10.5px; color: #94a3b8; display: block; margin-bottom: 3px; }
.term-field input {
  width: 100%; background: #030814; border: 1px solid #1e293b;
  border-radius: 5px; padding: 7px 9px; color: #fff; font-size: 12px; outline: none;
  transition: 0.2s;
}
.term-field input:focus {
  border-color: var(--term-cyan);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
}

.btn-terminal-exec {
  background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(0, 240, 255, 0.08));
  border: 1.5px solid var(--term-cyan); color: var(--term-cyan);
  border-radius: 5px; font-size: 12px; cursor: pointer; padding: 7px 12px;
  width: 100%; transition: 0.2s; font-weight: 800;
}
.btn-terminal-exec:hover {
  background: var(--term-cyan); color: #010409;
  box-shadow: 0 0 16px var(--term-cyan);
}

.table-terminal-card {
  background: var(--bg-panel); border: var(--border-dark);
  border-radius: 8px; flex: 1; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
}
.table-bar-hacker {
  padding: 8px 12px; border-bottom: 1px solid #1e293b;
  display: flex; justify-content: space-between; align-items: center; background: #020611;
}
.table-scroll-area { width: 100%; overflow-x: auto; flex: 1; }
table { width: 100%; border-collapse: collapse; text-align: right; font-size: 12px; }
th {
  background: #040916; padding: 9px 12px; color: var(--term-cyan);
  border-bottom: 1.5px solid rgba(0, 240, 255, 0.3); white-space: nowrap; font-size: 11px;
}
td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); white-space: nowrap; }
tr:hover td { background: rgba(0, 240, 255, 0.05); }

.tag-code {
  font-family: var(--font-code) !important;
  font-size: 10px; padding: 2px 6px; border-radius: 4px;
}
.tag-fam-code { background: rgba(0, 240, 255, 0.1); border: 1px solid var(--term-cyan); color: var(--term-cyan); }
.tag-rc-code { background: rgba(255, 183, 0, 0.1); border: 1px solid var(--term-amber); color: var(--term-amber); }
.tag-age { background: rgba(0, 255, 102, 0.1); border: 1px solid var(--term-green); color: var(--term-green); }

.btn-tactical-act {
  background: transparent; border: 1px solid #334155; color: #94a3b8;
  padding: 4px 9px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: 0.15s;
}
.btn-tactical-act:hover { border-color: var(--term-cyan); color: var(--term-cyan); }

/* ================= بەشی ٢: نەخشەی کارەبا (چاککراوی تەواو) ================= */
#tabElec { height: 100%; width: 100%; position: relative; }
#map { width: 100%; height: 100%; background: #020408; }

.floating-search-terminal {
  position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
  display: flex; flex-direction: column; gap: 4px;
}
.hacker-search-bar {
  background: rgba(3, 7, 18, 0.94); backdrop-filter: blur(12px);
  border: 1px solid var(--term-cyan); border-radius: 8px;
  padding: 3px 5px; display: flex; align-items: center; gap: 5px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.8);
}
.hacker-search-bar input {
  flex: 1; background: transparent; border: none; padding: 7px 10px;
  color: #fff; font-size: 12px; outline: none;
}
.hacker-search-bar button {
  background: var(--term-cyan); color: #020408; border: none;
  font-weight: 900; padding: 7px 12px; border-radius: 5px; font-size: 11px; cursor: pointer;
}

/* دراوەری ئەنجامەکان کە ئێستا بە تەواوی سکڕۆڵ دەبێت و ناپچڕێت */
#elecDrawer {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 1001;
  background: rgba(3, 8, 20, 0.98); backdrop-filter: blur(16px);
  border-top: 2px solid var(--term-cyan); border-radius: 14px 14px 0 0;
  padding: 12px 14px 45px;
  max-height: 75vh; /* بەرزایی تەواو بۆ نیشاندانی هەموو ئەنجامەکان */
  overflow-y: auto !important;
  display: none;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.95);
  touch-action: pan-y !important;
  -webkit-overflow-scrolling: touch !important;
}

.drawer-tactical-head {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: 8px; border-bottom: 1px solid #1e293b; margin-bottom: 10px;
}

.grid-tactical-results {
  display: flex; flex-direction: column; gap: 8px; padding-bottom: 30px;
}

.compact-sub-card {
  background: rgba(8, 16, 32, 0.92); border: 1px solid #1e293b;
  border-radius: 7px; padding: 9px 12px; cursor: pointer; transition: 0.15s;
}
.compact-sub-card:hover { border-color: var(--term-cyan); background: rgba(0, 240, 255, 0.06); }
.card-title-sm { font-size: 13px; color: #fff; font-weight: 800; margin-bottom: 4px; }
.card-meta-sm { font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; }

.tactical-layer-box {
  position: absolute; bottom: 16px; left: 10px; z-index: 999;
  background: rgba(3, 7, 18, 0.9); border: 1px solid #1e293b;
  border-radius: 6px; padding: 3px; display: flex; gap: 3px;
}
.btn-layer-pill {
  background: transparent; color: #94a3b8; border: none;
  padding: 4px 9px; border-radius: 4px; font-size: 10.5px; cursor: pointer;
}
.btn-layer-pill.active { background: rgba(0, 229, 255, 0.2); color: var(--term-cyan); border: 1px solid var(--term-cyan); }

.leaflet-popup-content-wrapper {
  background: rgba(3, 7, 18, 0.98) !important; border: 1px solid var(--term-cyan) !important;
  color: white !important; border-radius: 8px !important; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3) !important;
}
.leaflet-popup-tip { background: #030712 !important; }

.micro-target-point { display: flex; align-items: center; justify-content: center; }
.micro-ping-core {
  width: 9px; height: 9px; background: var(--term-green);
  border: 1.5px solid #ffffff; border-radius: 50%;
  box-shadow: 0 0 6px var(--term-green);
}
.micro-multi-core {
  width: 13px; height: 13px; background: var(--term-crimson);
  border: 1.5px solid #ffffff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-family: var(--font-code) !important;
  font-weight: 900; color: #ffffff; box-shadow: 0 0 8px var(--term-crimson);
}

/* ================= مۆداڵی دۆسیەی نهێنی هەواڵگری ================= */
.modal-dossier-overlay {
  position: fixed; inset: 0; background: rgba(1, 4, 9, 0.94);
  backdrop-filter: blur(12px); z-index: 5000; display: none;
  align-items: center; justify-content: center; padding: 10px;
}
.dossier-terminal-box {
  background: #020713; border: 1.5px solid var(--term-cyan);
  border-radius: 10px; width: 100%; max-width: 900px; max-height: 90vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 0 45px rgba(0, 240, 255, 0.25);
  position: relative;
}
.dossier-top-bar {
  background: #050d20; padding: 10px 16px; border-bottom: 1.5px solid var(--term-cyan);
  display: flex; justify-content: space-between; align-items: center;
}
.dossier-content-scroll { padding: 14px; overflow-y: auto; flex: 1; }

.exit-cmd-btn {
  background: rgba(255, 0, 60, 0.15); border: 1px solid var(--term-crimson);
  color: var(--term-crimson); padding: 5px 12px; border-radius: 5px;
  font-size: 11px; font-weight: 900; cursor: pointer; transition: 0.2s;
}
.exit-cmd-btn:hover { background: var(--term-crimson); color: white; box-shadow: 0 0 12px var(--term-crimson); }

.btn-pdf-export {
  background: linear-gradient(135deg, rgba(0, 255, 102, 0.3), rgba(0, 255, 102, 0.1));
  border: 1.5px solid var(--term-green); color: var(--term-green);
  padding: 5px 12px; border-radius: 5px; font-size: 11.5px; font-weight: 900;
  cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px;
}
.btn-pdf-export:hover {
  background: var(--term-green); color: #000; box-shadow: 0 0 14px var(--term-green);
}

/* ================= شاردنەوەی تەواوی نووسینەکانی PDF لەسەر شاشە ================= */
#printArea {
  display: none !important; /* هەرگیز لەسەر شاشە دەرناکەوێت و سیستم تێک نادات */
}

@media print {
  body, html {
    background: #ffffff !important;
    color: #000000 !important;
    height: auto !important;
    overflow: visible !important;
  }
  body::after, header, .main-viewport, .modal-dossier-overlay, .leaflet-control-container {
    display: none !important;
  }
  #printArea {
    display: block !important;
    width: 100% !important;
    background: #ffffff !important;
    color: #000000 !important;
    visibility: visible !important;
    padding: 0 !important;
  }
  #printArea * {
    visibility: visible !important;
    color: #000000 !important;
  }
}
</style>
</head>
<body>

<header>
  <div class="terminal-brand">
    <div class="pulse-indicator"></div>
    <div class="terminal-tag">DEF-INTEL // C4ISR</div>
    <div class="brand-name">ناوەندی هەواڵگری نیشتمانی <span>//</span> CLASSIFIED</div>
  </div>

  <div class="city-selector-hud">
    <button id="btnCityErbil" class="city-pill-btn active" onclick="switchCivilianCity('erbil')">🏛️ [EBL] هەولێر</button>
    <button id="btnCitySuli" class="city-pill-btn" onclick="switchCivilianCity('suli')">🌲 [SLI] سلێمانی</button>
    <button id="btnCityDuhok" class="city-pill-btn" onclick="switchCivilianCity('duhok')">🏔️ [DHK] دهۆك</button>
  </div>

  <div class="nav-hacker-tabs">
    <button id="btnTabFam" class="tab-cmd-btn active" onclick="switchTab('family')">
      👥 تۆماری هاوڵاتیان
    </button>
    <button id="btnTabElec" class="tab-cmd-btn" onclick="switchTab('elec')">
      ⚡ نەخشەی تاکتیکی کارەبا
    </button>
  </div>
</header>

<div class="main-viewport">

  <!-- ================= پەڕەی ١: تۆماری هاوڵاتیان ================= -->
  <div id="tabFamily">
    <div class="terminal-box" id="civTermBox" data-tag="[ SEC-SYS // DATA-QUERY: ERBIL ]">
      <div class="hacker-grid">
        <div class="term-field">
          <label>ناوی یەکەم</label>
          <input id="qFirst" placeholder="محمد / احمد..." onkeydown="if(event.key==='Enter') doSearchCivilians()">
        </div>
        <div class="term-field">
          <label>ناوی باوک</label>
          <input id="qFather" placeholder="علی / قادر..." onkeydown="if(event.key==='Enter') doSearchCivilians()">
        </div>
        <div class="term-field">
          <label>ناوی باپیر</label>
          <input id="qGrand" placeholder="حسن..." onkeydown="if(event.key==='Enter') doSearchCivilians()">
        </div>
        <div class="term-field">
          <label>ژمارەی خێزان</label>
          <input id="qFam" placeholder="FAM_NO..." onkeydown="if(event.key==='Enter') doSearchCivilians()">
        </div>
        <div style="display:flex;align-items:flex-end;">
          <button class="btn-terminal-exec" onclick="doSearchCivilians()">[ EXECUTE // پشکنین ]</button>
        </div>
      </div>
    </div>

    <div class="table-terminal-card">
      <div class="table-bar-hacker">
        <span id="famStatus" style="font-family:var(--font-code);font-size:11px;color:var(--term-cyan);">STATUS: SYSTEM READY</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <button onclick="navFam(-1)" class="btn-tactical-act" id="btnPrev" disabled>« پێشوو</button>
          <span id="famPageText" style="font-family:var(--font-code);font-size:11px;color:#fff;">PAGE 1</span>
          <button onclick="navFam(1)" class="btn-tactical-act" id="btnNext" disabled>دواتر »</button>
        </div>
      </div>

      <div class="table-scroll-area">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>ناوی تەواو</th>
              <th>ناوی دایک</th>
              <th>لەدایکبوون</th>
              <th>خێزان</th>
              <th>تۆمار</th>
              <th>کرداری هەواڵگری</th>
            </tr>
          </thead>
          <tbody id="famTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>


  <!-- ================= پەڕەی ٢: نەخشەی کارەبا (چاککراو بە سکڕۆڵی تەواو) ================= -->
  <div id="tabElec" style="display: none;">
    
    <div class="floating-search-terminal">
      <div class="hacker-search-bar">
        <span style="font-family:var(--font-code);color:var(--term-cyan);padding:0 4px;">>_</span>
        <input id="elecQuery" placeholder="ناوی بەشداربوو یان ژمارەی ئەژمار..." onkeydown="if(event.key==='Enter') doMultiSearchElectricity()">
        <button onclick="doMultiSearchElectricity()">پشکنین</button>
      </div>
    </div>

    <div class="tactical-layer-box">
      <button id="btnLGoogle" class="btn-layer-pill active" onclick="setMapLayer('google')">سەتەلایت</button>
      <button id="btnLDark" class="btn-layer-pill" onclick="setMapLayer('dark')">تاریك</button>
      <button id="btnLOsm" class="btn-layer-pill" onclick="setMapLayer('osm')">ئاسایی</button>
    </div>

    <div id="map"></div>

    <!-- دراوەری چاککراوی ئەنجامەکان -->
    <div id="elecDrawer">
      <div class="drawer-tactical-head">
        <div style="font-family:var(--font-code);font-size:11.5px;color:var(--term-cyan);" id="elecResultCount">
          [ 0 RESULTS FOUND ]
        </div>
        <div style="display:flex;gap:6px;">
          <button onclick="toggleDrawerHeight()" style="background:#0c192e;border:1px solid var(--term-cyan);color:var(--term-cyan);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px;" id="btnToggleDrawer">⛶ فراوانکردن</button>
          <button onclick="$('elecDrawer').style.display='none'" style="background:transparent;border:1px solid #334155;color:#fff;width:24px;height:24px;border-radius:4px;cursor:pointer;">✕</button>
        </div>
      </div>
      <div class="grid-tactical-results" id="elecResultsGrid"></div>
    </div>

  </div>

</div>


<!-- ================= مۆداڵی دۆسیەی نهێنی هەواڵگری ================= -->
<div id="dossierModal" class="modal-dossier-overlay">
  <div class="dossier-terminal-box">
    <div class="dossier-top-bar">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-family:var(--font-code);font-size:10px;color:var(--term-crimson);border:1px solid var(--term-crimson);padding:1px 6px;border-radius:3px;">TOP SECRET</span>
        <h2 id="dossierTitle" style="font-size:13.5px;color:#fff;">دۆسیەی نهێنی</h2>
      </div>
      <div style="display:flex;gap:6px;" id="dossierActions">
        <button onclick="closeDossierModal()" class="exit-cmd-btn">[ ESC // داخستن ]</button>
      </div>
    </div>

    <div class="dossier-content-scroll" id="dossierBody"></div>
  </div>
</div>

let activeCity = 'erbil';

  return CITIES[activeCity];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cleanRawSymbols(text) {
  if (!text) return '';
  return String(text)
    .replace(/[\u0000-\u001F\u007F-\u009F\uE000-\uF8FF\uFFF0-\uFFFF]/g, '')
    .replace(/[„“”"«»'’‘،,ـ\-_~`\\\/󰀀]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function getVal(row, key) {
  if (!row) return '';
  return row[key.toLowerCase()] ?? row[key.toUpperCase()] ?? '';
}

function assembleFullName(r) {
  const f = cleanRawSymbols(getVal(r, 'p_first'));
  const fa = cleanRawSymbols(getVal(r, 'p_father'));
  const g = cleanRawSymbols(getVal(r, 'p_grand'));
  return [f, fa, g].filter(Boolean).join(' ') || '---';
}

function calculateAge(birthVal) {
  if (!birthVal) return { year: 9999, ageText: '---' };
  const str = String(birthVal);
  const match = str.match(/\b(19\d{2}|20\d{2})\b/);
  if (!match) return { year: 9999, ageText: '---' };
  
  const year = parseInt(match[1]);
  const currentYear = new Date().getFullYear();
  const age = currentYear - year;
  return { year: year, ageText: `${age} ساڵ` };
}

let famPage = 1;

async function doSearchCivilians() {
  famPage = 1;
  loadCivilians();
}

function navFam(dir) {
  famPage += dir;
  loadCivilians();
}

async function loadCivilians() {
  const cfg = getActiveCity();
  const offset = (famPage - 1) * famLimit;
  let params = new URLSearchParams();
  params.set('select', '*');
  params.set('limit', String(famLimit));
  params.set('offset', String(offset));

  const qF = cleanRawSymbols($('qFirst').value);
  const qFa = cleanRawSymbols($('qFather').value);
  const qG = cleanRawSymbols($('qGrand').value);
  const qFam = $('qFam').value.trim();

  const kFirst = cfg.isUpper ? 'P_FIRST' : 'p_first';
  const kFather = cfg.isUpper ? 'P_FATHER' : 'p_father';
  const kGrand = cfg.isUpper ? 'P_GRAND' : 'p_grand';
  const kFam = cfg.isUpper ? 'FAM_NO' : 'fam_no';

  if (qF) params.set(kFirst, `ilike.*${qF.replace(/[یيى]/g, '_').replace(/[کك]/g, '_')}*`);
  if (qFa) params.set(kFather, `ilike.*${qFa.replace(/[یيى]/g, '_').replace(/[کك]/g, '_')}*`);
  if (qG) params.set(kGrand, `ilike.*${qG.replace(/[یيى]/g, '_').replace(/[کك]/g, '_')}*`);
  if (qFam) params.set(kFam, cfg.isUpper ? `ilike.*${qFam}*` : `eq.${qFam}`);

  $('famStatus').textContent = `QUERYING [${cfg.name}]...`;

  try {
    const res = await fetch(`${cfg.url}/rest/v1/${cfg.table}?${params.toString()}`, {
      headers: { 'apikey': cfg.key, 'Authorization': `Bearer ${cfg.key}` }
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || "هەڵە لە پەیوەندی بە داتابەیس");
    }

    famData = await res.json();
    renderCivilians(offset);
  } catch (err) {
    $('famTableBody').innerHTML = `<tr><td colspan="7" style="color:var(--term-crimson);text-align:center;padding:20px;">هەڵە: ${esc(err.message)}</td></tr>`;
    $('famStatus').textContent = "ERROR";
  }
}

}

// هێنانی خێزان بە ڕیزبەندی تەمەن لە گەورەوە بۆ بچووک
async function showFamilyMembersModal(idx) {
  const p = famData[idx];
  if (!p) return;

  const famNo = cleanRawSymbols(getVal(p, 'fam_no'));
  const rcNo = cleanRawSymbols(getVal(p, 'rc_no'));
  if (!famNo || famNo === '---') return alert("ژمارەی خێزان نییە!");

  const cfg = getActiveCity();
  const kFam = cfg.isUpper ? 'FAM_NO' : 'fam_no';
  const kRc = cfg.isUpper ? 'RC_NO' : 'rc_no';

  let url = `${cfg.url}/rest/v1/${cfg.table}?${kFam}=${cfg.isUpper ? `ilike.*${famNo}*` : `eq.${famNo}`}`;
  if (rcNo && rcNo !== '---' && !cfg.isUpper) url += `&${kRc}=eq.${rcNo}`;

  try {
    const res = await fetch(url, { headers: { 'apikey': cfg.key, 'Authorization': `Bearer ${cfg.key}` } });
    if (!res.ok) throw new Error("نەتوانرا خێزان وەربگیرێت");
    let members = await res.json();

    if (!Array.isArray(members) || !members.length) {
      return alert("هیچ ئەندامێکی تر نەدۆزرایەوە!");
    }

    // ڕیزبەندی بەپێی تەمەن لە گەورەوە بۆ بچووک (Oldest to Youngest)
    members.sort((a, b) => {
      const bA = calculateAge(cleanRawSymbols(getVal(a, 'p_birth'))).year;
      const bB = calculateAge(cleanRawSymbols(getVal(b, 'p_birth'))).year;
      return bA - bB;
    });

    currentFamilyMembersCache = members;
    currentFamilyInfoCache = { famNo, rcNo, city: cfg.name };

    const pdfBtnHtml = `<button onclick="exportFamilyPDF()" class="btn-pdf-export">📄 داگرتنی PDF / چاپ</button>`;

    const html = `
      <div style="background:#01050e;border:1px solid var(--term-cyan);padding:10px 14px;border-radius:6px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div style="font-family:var(--font-code);font-size:11.5px;">
          REGION: <b style="color:#fff;">${cfg.name}</b> | TARGET FAM_NO: <b style="color:var(--term-cyan);">${esc(famNo)}</b> | TOTAL: <b style="color:var(--term-green);">${members.length} ئەندام</b>
        </div>
        <div style="font-size:11px;color:var(--term-amber);">
          ⚡ ڕیزبەندی: بەپێی تەمەن (لە گەورەوە بۆ بچووک)
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>ناوی تەواو</th>
              <th>سیفەت</th>
              <th>ناوی دایک</th>
              <th>لەدایکبوون</th>
              <th>تەمەن</th>
              <th>ژمارەی ناسنامە</th>
            </tr>
          </thead>
          <tbody>
            ${members.map((m, i) => {
              const birth = cleanRawSymbols(getVal(m, 'p_birth')) || '---';
              const ageInfo = calculateAge(birth);
              return `
                <tr>
                  <td style="color:#64748b;font-family:var(--font-code);">${i + 1}</td>
                  <td style="color:#fff;font-weight:800;">${esc(assembleFullName(m))}</td>
                  <td style="color:var(--term-green);">${esc(cleanRawSymbols(getVal(m, 'p_relation')) || '---')}</td>
                  <td>${esc(cleanRawSymbols(getVal(m, 'p_mother')) || '---')}</td>
                  <td style="font-family:var(--font-code);color:var(--term-cyan);">${esc(birth)}</td>
                  <td><span class="tag-code tag-age">${ageInfo.ageText}</span></td>
                  <td style="color:var(--term-amber);font-family:var(--font-code);">${esc(cleanRawSymbols(getVal(m, 'ss_id_no')) || '---')}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;

    openDossier(html, `دۆسیەی خێزانی #${famNo} (${cfg.name})`, pdfBtnHtml);
  } catch (e) {
    alert("هەڵە لە وەرگرتنی ئەندامان!");
  }
}

}

// دەستبەجێ دوای چاپ یان داخستن، زاکیرەی PDF پاک دەکرێتەوە تا هیچ نەمێنێت لەسەر شاشە
window.addEventListener('afterprint', () => {
  const p = $('printArea');
  if (p) p.innerHTML = '';
});

function crossSearchElec(first) {
  closeDossierModal();
  switchTab('elec');
  $('elecQuery').value = first;
  doMultiSearchElectricity();
}


// ================= ٢: نەخشەی کارەبا (چاککراو بە سکڕۆڵی ئاسان) =================
const SUPABASE_PROJECT_URL = "https://ebfunixtvuevknmjnjrv.supabase.co";
const API_KEY = "sb_publishable_yJ-m3quR_e5socN7LPwBsw_ZHMp26dr";

let map = null;
let tacticalLayer = null;
let layerGoogle = null;
let layerDark = null;
let layerOsm = null;
let coLocatedGroups = [];
let focusPulse = null;
let isDrawerExpanded = false;

function initTacticalMap() {
  if (map) { map.invalidateSize(); return; }

  map = L.map('map', { preferCanvas: true, zoomControl: false }).setView([36.20, 44.00], 11);

  layerGoogle = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 });
  layerDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 });
  layerOsm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

  layerGoogle.addTo(map);
  tacticalLayer = L.layerGroup().addTo(map);

  map.on('moveend zoomend', debounce(fetchVisiblePoints, 180));

  // ڕێگریکردن لەوەی نەخشە سکڕۆڵی مۆبایلەکە بگرێت
  const drawer = $('elecDrawer');
  if (drawer && window.L) {
    L.DomEvent.disableScrollPropagation(drawer);
    L.DomEvent.disableClickPropagation(drawer);
  }
}

function toggleDrawerHeight() {
  const drawer = $('elecDrawer');
  const btn = $('btnToggleDrawer');
  isDrawerExpanded = !isDrawerExpanded;

  if (isDrawerExpanded) {
    drawer.style.maxHeight = '90vh';
    btn.textContent = '🗗 بچووککردنەوە';
  } else {
    drawer.style.maxHeight = '75vh';
    btn.textContent = '⛶ فراوانکردن';
  }
}

function debounce(fn, ms) {
  let timer;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), ms);
  };
}

function setMapLayer(type) {
  [layerGoogle, layerDark, layerOsm].forEach(l => map.removeLayer(l));
  $('btnLGoogle').classList.remove('active');
  $('btnLDark').classList.remove('active');
  $('btnLOsm').classList.remove('active');

  if (type === 'google') { layerGoogle.addTo(map); $('btnLGoogle').classList.add('active'); }
  if (type === 'dark') { layerDark.addTo(map); $('btnLDark').classList.add('active'); }
  if (type === 'osm') { layerOsm.addTo(map); $('btnLOsm').classList.add('active'); }
}

async function fetchVisiblePoints() {
  if (!map || !tacticalLayer) return;

  const b = map.getBounds();
  const url = `${SUPABASE_PROJECT_URL}/rest/v1/electricity?select=*&latitude=gte.${b.getSouth()}&latitude=lte.${b.getNorth()}&longitude=gte.${b.getWest()}&longitude=lte.${b.getEast()}&limit=1200`;

  try {
    const res = await fetch(url, { headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` } });
    if (!res.ok) return;
    const pts = await res.json();

    tacticalLayer.clearLayers();

    const coordMap = new Map();
    pts.forEach(p => {
      const lat = parseFloat(p.latitude);
      const lon = parseFloat(p.longitude);
      if (!lat || !lon) return;

      const k = lat.toFixed(5) + '_' + lon.toFixed(5);
      if (!coordMap.has(k)) {
        coordMap.set(k, { lat, lon, rows: [] });
      }
      coordMap.get(k).rows.push(p);
    });

    coLocatedGroups = Array.from(coordMap.values());

    coLocatedGroups.forEach((g, gIdx) => {
      const count = g.rows.length;
      let marker;

      if (count > 1) {
        const icon = L.divIcon({
          className: 'micro-target-point',
          html: `<div class="micro-multi-core">${count}</div>`,
          iconSize: [13, 13]
        });
        marker = L.marker([g.lat, g.lon], { icon: icon });
      } else {
        const icon = L.divIcon({
          className: 'micro-target-point',
          html: `<div class="micro-ping-core"></div>`,
          iconSize: [9, 9]
        });
        marker = L.marker([g.lat, g.lon], { icon: icon });
      }

      const popupHtml = `
        <div style="direction:rtl;text-align:right;min-width:210px;max-height:260px;overflow-y:auto;padding:2px;">
          <div style="color:var(--term-cyan);font-size:12px;font-weight:900;border-bottom:1px solid #334155;padding-bottom:4px;margin-bottom:6px;">
            📍 شوێن: ${count} بەشداربووی تۆمارکراو
          </div>
          ${g.rows.map((it, idx) => `
            <div style="background:#020408;padding:5px;border-radius:4px;margin-bottom:4px;border:1px solid #1e293b;">
              <div style="color:#fff;font-size:11.5px;font-weight:800;">${idx+1}. ${esc(cleanRawSymbols(it.name))}</div>
              <div style="font-size:10px;color:var(--term-green);font-family:var(--font-code);">ئەژمار: ${esc(it.account_no || '---')}</div>
            </div>
          `).join('')}
          <button onclick="openCoLocationDossier(${gIdx})" style="width:100%;background:var(--term-cyan);color:#020408;border:none;padding:5px;border-radius:4px;font-weight:900;cursor:pointer;margin-top:4px;font-size:11px;">
            بینینی دۆسیەی تەواو ↗
          </button>
        </div>
      `;

      marker.bindPopup(popupHtml);
      tacticalLayer.addLayer(marker);
    });

  } catch (e) {}
}

function openCoLocationDossier(gIdx) {
  const g = coLocatedGroups[gIdx];
  if (!g) return;

  const html = `
    <div style="background:#020408;border:1px solid var(--term-cyan);border-radius:8px;padding:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h3 style="color:var(--term-cyan);font-size:14px;">کۆی گشتی (${g.rows.length}) بەشداربوو لەم شوێنەدان</h3>
        <p style="font-size:11px;color:#94a3b8;font-family:var(--font-code);">${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}</p>
      </div>
      <a target="_blank" href="https://www.google.com/maps?q=${g.lat},${g.lon}" style="background:var(--term-green);color:#000;padding:5px 10px;border-radius:5px;text-decoration:none;font-size:11px;font-weight:900;">Google Maps</a>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:8px;">
      ${g.rows.map((r, i) => `
        <div style="background:#060d1a;border:1px solid #1e293b;border-radius:8px;padding:10px;">
          <div style="color:#fff;font-size:12.5px;font-weight:900;margin-bottom:4px;">
            ${i+1}. ${esc(cleanRawSymbols(r.name) || 'هاوبەش')}
          </div>
          <div style="font-size:11px;color:#cbd5e1;line-height:1.6;">
            <div>ئەژمار: <b style="color:var(--term-green);font-family:var(--font-code);">${esc(r.account_no || '---')}</b></div>
            <div>ناوچە / شار: <b>${esc(cleanRawSymbols(r.city) || '---')}</b></div>
            <div>تێبینی: <b>${esc(r.note || '---')}</b></div>
          </div>
          <button class="btn-terminal-exec" style="margin-top:6px;padding:3px;font-size:10.5px;" onclick="crossSearchCivilians('${esc(cleanRawSymbols(r.name))}')">👥 پشکنینی خێزانی</button>
        </div>
      `).join('')}
    </div>
  `;

  openDossier(html, `دۆسیەی خاڵ: ${g.rows.length} تۆمار`);
}

async function doMultiSearchElectricity() {
  const rawQ = $('elecQuery').value.trim();
  const q = cleanRawSymbols(rawQ);
  if (!q) return alert("تکایە ناوێک یان ژمارەیەک بنووسە!");

  const drawer = $('elecDrawer');
  const grid = $('elecResultsGrid');
  drawer.style.display = 'block';
  grid.innerHTML = '<div style="color:var(--term-green);padding:10px;font-size:11px;">دەگەڕێین لە داتابەیس...</div>';
  $('elecResultCount').textContent = "[ QUERYING... ]";

  try {
    const url = `${SUPABASE_PROJECT_URL}/rest/v1/electricity?select=*&or=(name.ilike.*${encodeURIComponent(q)}*,account_no.ilike.*${encodeURIComponent(q)}*,city.ilike.*${encodeURIComponent(q)}*)&limit=250`;
    const res = await fetch(url, { headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` } });
    const records = await res.json();

    $('elecResultCount').textContent = `[ ${records.length} تۆمار دۆزرایەوە ]`;

    if (!records.length) {
      grid.innerHTML = '<div style="color:var(--term-crimson);padding:10px;font-size:11px;">هیچ هاوبەشێک نەدۆزرایەوە!</div>';
      return;
    }

    grid.innerHTML = '';
    records.forEach(item => {
      const card = document.createElement('div');
      card.className = 'compact-sub-card';
      card.innerHTML = `
        <div class="card-title-sm">${esc(cleanRawSymbols(item.name))}</div>
        <div class="card-meta-sm">
          <span>ئەژمار: <b style="color:var(--term-cyan);">${esc(item.account_no || '---')}</b></span>
          <span><b>${esc(cleanRawSymbols(item.city) || '---')}</b></span>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px;">
          <button class="btn-tactical-act" style="flex:1;" onclick='focusElectricityOnMap(${JSON.stringify(item)})'>📍 نەخشە</button>
          <button class="btn-tactical-act" style="color:var(--term-cyan);" onclick='openSingleDossier(${JSON.stringify(item)})'>دۆسیە</button>
        </div>
      `;
      grid.appendChild(card);
    });

  } catch (e) {
    grid.innerHTML = `<div style="color:var(--term-crimson);padding:10px;">هەڵە: ${esc(e.message)}</div>`;
  }
}

function focusElectricityOnMap(item) {
  const lat = parseFloat(item.latitude);
  const lon = parseFloat(item.longitude);
  if (!lat || !lon) return alert("کۆئۆردینات نییە!");

  $('elecDrawer').style.display = 'none';
  map.setView([lat, lon], 17);

  if (focusPulse) map.removeLayer(focusPulse);

  focusPulse = L.circleMarker([lat, lon], {
    radius: 9,
    color: '#00e5ff',
    fillColor: '#ff003c',
    fillOpacity: 1,
    weight: 2
  }).addTo(map);

  focusPulse.bindPopup(`
    <div style="direction:rtl;text-align:right;">
      <b style="color:var(--term-cyan);font-size:12px;">${esc(cleanRawSymbols(item.name))}</b><br>
      <span style="font-size:11px;">ئەژمار: ${esc(item.account_no || '---')}</span><br>
      <span style="font-size:11px;color:#94a3b8;">ناوچە: ${esc(cleanRawSymbols(item.city) || '---')}</span><br>
      <button onclick='openSingleDossier(${JSON.stringify(item)})' style="margin-top:5px;width:100%;background:var(--term-green);color:#000;border:none;padding:4px;border-radius:4px;font-weight:900;cursor:pointer;font-size:10.5px;">دۆسیەی تەواو</button>
    </div>
  `).openPopup();
}

function openSingleDossier(item) {
  const g = { lat: parseFloat(item.latitude), lon: parseFloat(item.longitude), rows: [item] };
  coLocatedGroups.push(g);
  openCoLocationDossier(coLocatedGroups.length - 1);
}

function crossSearchCivilians(name) {
  closeDossierModal();
  switchTab('family');
  const p = name.split(' ');
  $('qFirst').value = p[0] || '';
  $('qFather').value = p[1] || '';
  doSearchCivilians();
}

loadCivilians();
